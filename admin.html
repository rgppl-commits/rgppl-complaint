<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal - RGPPL / NTPC Complaint Management</title>
  <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/9/91/NTPC_Logo.svg" type="image/svg+xml">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #eef2f7; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .header-bg { background-color: #002244; color: #ffffff; padding: 16px 0; border-bottom: 3px solid #ff9900; }
    .card-login { border: none; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.12); }
    .badge-pending { background-color: #ffc107; color: #000; }
    .badge-inprogress { background-color: #0dcaf0; color: #000; }
    .badge-resolved { background-color: #198754; color: #fff; }
    .table-container { background: #ffffff; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); padding: 20px; }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <div class="header-bg mb-4">
    <div class="container d-flex justify-content-between align-items-center">
      <h5 class="mb-0 fw-bold">
        <i class="fa-solid fa-shield-halved text-warning me-2"></i> RGPPL Admin Console
      </h5>
      <a href="index.html" class="btn btn-outline-light btn-sm">
        <i class="fa-solid fa-arrow-left me-1"></i> Public Portal
      </a>
    </div>
  </div>

  <div class="container pb-5">

    <!-- 1. Admin Login Card -->
    <div id="loginSection" class="row justify-content-center pt-4">
      <div class="col-md-4">
        <div class="card card-login p-4 bg-white">
          <div class="text-center mb-3">
            <i class="fa-solid fa-user-lock fa-3x text-primary mb-2"></i>
            <h5 class="fw-bold text-dark">Portal Authentication</h5>
            <small class="text-muted">Sign in to manage plant complaints</small>
          </div>
          <form id="adminLoginForm">
            <div class="mb-3">
              <label class="form-label fw-semibold">Username</label>
              <input type="text" id="adminUser" class="form-control" placeholder="Enter username" required value="admin">
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Password</label>
              <input type="password" id="adminPass" class="form-control" placeholder="Enter password" required value="admin123">
            </div>
            <button type="submit" id="loginSubmitBtn" class="btn btn-primary w-100 fw-bold py-2">
              <i class="fa-solid fa-right-to-bracket me-1"></i> Login
            </button>
          </form>
          <div id="loginMsg" class="mt-3 text-center small"></div>
        </div>
      </div>
    </div>

    <!-- 2. Dashboard Section -->
    <div id="dashboardSection" style="display: none;">
      
      <!-- Stats / Control Bar -->
      <div class="row mb-3 align-items-center g-2">
        <div class="col-md-4">
          <h4 class="fw-bold mb-0 text-dark">Complaints Database</h4>
        </div>
        <div class="col-md-5">
          <div class="input-group">
            <span class="input-group-text bg-white"><i class="fa-solid fa-search text-muted"></i></span>
            <input type="text" id="tableSearch" class="form-control" placeholder="Search by ID, Name, Location or Dept...">
          </div>
        </div>
        <div class="col-md-3 text-md-end">
          <button id="refreshBtn" class="btn btn-secondary btn-sm me-2">
            <i class="fa-solid fa-rotate-right me-1"></i> Refresh Data
          </button>
          <button id="logoutBtn" class="btn btn-danger btn-sm">
            <i class="fa-solid fa-power-off me-1"></i> Logout
          </button>
        </div>
      </div>

      <!-- Table Card -->
      <div class="table-container">
        <div class="table-responsive">
          <table class="table table-bordered table-hover align-middle mb-0">
            <thead class="table-dark">
              <tr>
                <th style="width: 70px;">ID</th>
                <th style="width: 100px;">Date</th>
                <th>Complainant Details</th>
                <th>Department & Issue</th>
                <th style="width: 130px;">Current Status</th>
                <th style="width: 220px;">Remarks</th>
                <th style="width: 160px;">Update Action</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>

    </div>

  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbz2BTrcJ-SJcCBHDKMoz5sQRC0flvjMdpkZVzFweZaTAhNAlTrETmEnelV7EROt0pKd/exec";
    let allComplaintsCache = [];

    // Helper: Send payload without CORS preflight issues
    async function sendRequest(payload) {
      const response = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });
      return await response.json();
    }

    // 1. Handle Admin Login
    document.getElementById("adminLoginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const user = document.getElementById("adminUser").value.trim();
      const pass = document.getElementById("adminPass").value.trim();
      const btn = document.getElementById("loginSubmitBtn");
      const msg = document.getElementById("loginMsg");

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-1"></i> Verifying...';
      msg.innerHTML = '';

      try {
        const data = await sendRequest({ action: "adminLogin", username: user, password: pass });
        if (data.success) {
          document.getElementById("loginSection").style.display = "none";
          document.getElementById("dashboardSection").style.display = "block";
          loadComplaints();
        } else {
          msg.innerHTML = `<span class="text-danger fw-bold"><i class="fa-solid fa-circle-exclamation me-1"></i>${data.message || 'Invalid Credentials'}</span>`;
        }
      } catch (err) {
        msg.innerHTML = '<span class="text-danger fw-bold"><i class="fa-solid fa-triangle-exclamation me-1"></i>Server unreachable. Make sure Apps Script is deployed as "Anyone".</span>';
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-right-to-bracket me-1"></i> Login';
      }
    });

    // 2. Fetch Complaints
    async function loadComplaints() {
      const tbody = document.getElementById("tableBody");
      tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4"><i class="fa-solid fa-spinner fa-spin fa-2x text-primary"></i><p class="mt-2 mb-0">Fetching live records...</p></td></tr>';

      try {
        const list = await sendRequest({ action: "getComplaints" });
        allComplaintsCache = Array.isArray(list) ? list : [];
        renderTable(allComplaintsCache);
      } catch (e) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-danger text-center py-3"><i class="fa-solid fa-circle-xmark me-1"></i>Failed to load database.</td></tr>';
      }
    }

    // 3. Render Table Rows
    function renderTable(data) {
      const tbody = document.getElementById("tableBody");
      tbody.innerHTML = '';

      if (!data || data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-4">No complaint records found.</td></tr>';
        return;
      }

      data.forEach(row => {
        const id = row[0];
        const date = row[1];
        const name = row[3];
        const location = row[4];
        const contact = row[5];
        const category = row[6] || '-';
        const issue = row[7];
        const dept = row[8];
        const status = row[9] || 'Pending';
        const remarks = row[10] || '';

        let badgeClass = 'badge-pending';
        if (status === 'In Progress') badgeClass = 'badge-inprogress';
        if (status === 'Resolved') badgeClass = 'badge-resolved';

        tbody.innerHTML += `
          <tr>
            <td class="fw-bold text-primary">#${id}</td>
            <td><small>${date}</small></td>
            <td>
              <div class="fw-bold">${name}</div>
              <small class="text-muted"><i class="fa-solid fa-location-dot me-1"></i>${location}</small><br>
              <small class="text-muted"><i class="fa-solid fa-phone me-1"></i>${contact}</small>
            </td>
            <td>
              <span class="badge bg-secondary mb-1">${dept}</span><br>
              <strong>Type:</strong> <small>${category}</small><br>
              <div class="small mt-1 text-secondary">${issue}</div>
            </td>
            <td>
              <span class="badge ${badgeClass} p-2 w-100">${status}</span>
            </td>
            <td>
              <textarea id="rem_${id}" class="form-control form-control-sm" rows="2" placeholder="Add resolution note...">${remarks}</textarea>
            </td>
            <td>
              <select id="stat_${id}" class="form-select form-select-sm mb-2">
                <option value="Pending" ${status === 'Pending' ? 'selected' : ''}>Pending</option>
                <option value="In Progress" ${status === 'In Progress' ? 'selected' : ''}>In Progress</option>
                <option value="Resolved" ${status === 'Resolved' ? 'selected' : ''}>Resolved</option>
              </select>
              <button class="btn btn-sm btn-success w-100" onclick="updateTicket('${id}')">
                <i class="fa-solid fa-floppy-disk me-1"></i> Save
              </button>
            </td>
          </tr>
        `;
      });
    }

    // 4. Update Complaint Status & Remarks
    async function updateTicket(id) {
      const status = document.getElementById(`stat_${id}`).value;
      const remarks = document.getElementById(`rem_${id}`).value;

      try {
        const res = await sendRequest({
          action: "updateStatus",
          complaintId: id,
          status: status,
          remarks: remarks
        });

        if (res.success) {
          alert("Ticket #" + id + " updated successfully!");
          loadComplaints();
        } else {
          alert("Update failed: " + (res.message || "Unknown error"));
        }
      } catch (err) {
        alert("Failed to connect to backend server.");
      }
    }

    // 5. Search Filter
    document.getElementById("tableSearch").addEventListener("input", (e) => {
      const query = e.target.value.toLowerCase().trim();
      const filtered = allComplaintsCache.filter(row => {
        return row.some(cell => String(cell).toLowerCase().includes(query));
      });
      renderTable(filtered);
    });

    // 6. Refresh & Logout
    document.getElementById("refreshBtn").addEventListener("click", loadComplaints);
    document.getElementById("logoutBtn").addEventListener("click", () => {
      document.getElementById("dashboardSection").style.display = "none";
      document.getElementById("loginSection").style.display = "flex";
      document.getElementById("adminLoginForm").reset();
    });
  </script>
</body>
</html>
