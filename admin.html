<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal - RGPPL</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #eef2f7; font-family: 'Segoe UI', sans-serif; }
    .header-bg { background-color: #002244; color: white; padding: 15px 0; }
  </style>
</head>
<body>

  <div class="header-bg mb-4">
    <div class="container d-flex justify-content-between align-items-center">
      <h5 class="mb-0"><i class="fa-solid fa-shield-halved text-warning"></i> RGPPL Admin Console</h5>
      <a href="index.html" class="btn btn-outline-light btn-sm"><i class="fa-solid fa-house"></i> Public Portal</a>
    </div>
  </div>

  <div class="container">
    <!-- Login Box -->
    <div id="loginSection" class="row justify-content-center">
      <div class="col-md-4">
        <div class="card p-4 shadow-sm">
          <h5 class="text-center text-primary mb-3">Admin Login</h5>
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" id="adminUser" class="form-control" value="admin">
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" id="adminPass" class="form-control" value="admin123">
          </div>
          <button id="loginBtn" class="btn btn-primary w-100">Login</button>
          <div id="loginMsg" class="mt-2 text-danger text-center"></div>
        </div>
      </div>
    </div>

    <!-- Dashboard Table -->
    <div id="dashboardSection" style="display: none;">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h4>All Registered Complaints</h4>
        <button id="refreshBtn" class="btn btn-secondary btn-sm"><i class="fa-solid fa-rotate-right"></i> Refresh</button>
      </div>
      <div class="table-responsive bg-white rounded shadow-sm p-3">
        <table class="table table-bordered table-hover align-middle">
          <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>Date</th>
              <th>Name</th>
              <th>Location</th>
              <th>Dept</th>
              <th>Complaint</th>
              <th>Status</th>
              <th>Remarks</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbz2BTrcJ-SJcCBHDKMoz5sQRC0flvjMdpkZVzFweZaTAhNAlTrETmEnelV7EROt0pKd/exec";

    document.getElementById("loginBtn").addEventListener("click", async () => {
      const user = document.getElementById("adminUser").value;
      const pass = document.getElementById("adminPass").value;
      const msg = document.getElementById("loginMsg");
      msg.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Authenticating...';

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({ action: "adminLogin", username: user, password: pass })
        });
        const data = await res.json();
        if (data.success) {
          document.getElementById("loginSection").style.display = "none";
          document.getElementById("dashboardSection").style.display = "block";
          loadComplaints();
        } else {
          msg.innerText = data.message;
        }
      } catch (err) {
        msg.innerText = "Connection failed.";
      }
    });

    async function loadComplaints() {
      const tbody = document.getElementById("tableBody");
      tbody.innerHTML = '<tr><td colspan="9" class="text-center"><i class="fa-solid fa-spinner fa-spin"></i> Loading complaints...</td></tr>';
      
      try {
        const res = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({ action: "getComplaints" })
        });
        const list = await res.json();
        tbody.innerHTML = '';
        list.forEach(row => {
          tbody.innerHTML += `
            <tr>
              <td><strong>#${row[0]}</strong></td>
              <td>${row[1]}</td>
              <td>${row[3]}</td>
              <td>${row[4]}</td>
              <td>${row[8]}</td>
              <td>${row[7]}</td>
              <td><span class="badge bg-${row[9] === 'Resolved' ? 'success' : 'warning text-dark'}">${row[9]}</span></td>
              <td><input type="text" id="rem_${row[0]}" class="form-control form-control-sm" value="${row[10] || ''}"></td>
              <td>
                <select id="stat_${row[0]}" class="form-select form-select-sm mb-1">
                  <option value="Pending" ${row[9] === 'Pending' ? 'selected' : ''}>Pending</option>
                  <option value="In Progress" ${row[9] === 'In Progress' ? 'selected' : ''}>In Progress</option>
                  <option value="Resolved" ${row[9] === 'Resolved' ? 'selected' : ''}>Resolved</option>
                </select>
                <button class="btn btn-sm btn-success w-100" onclick="updateTicket('${row[0]}')">Update</button>
              </td>
            </tr>`;
        });
      } catch (e) {
        tbody.innerHTML = '<tr><td colspan="9" class="text-danger text-center">Failed to load data.</td></tr>';
      }
    }

    document.getElementById("refreshBtn").addEventListener("click", loadComplaints);

    async function updateTicket(id) {
      const status = document.getElementById(`stat_${id}`).value;
      const remarks = document.getElementById(`rem_${id}`).value;
      
      try {
        await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({ action: "updateStatus", complaintId: id, status: status, remarks: remarks })
        });
        alert("Ticket #" + id + " updated successfully!");
        loadComplaints();
      } catch (err) {
        alert("Failed to update status.");
      }
    }
  </script>
</body>
</html>
