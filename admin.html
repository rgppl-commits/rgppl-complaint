<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RGPPL - Online Complaint Portal</title>
  <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/9/91/NTPC_Logo.svg" type="image/svg+xml">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #f0f3f8; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .header-bg { background: linear-gradient(135deg, #002244, #004080); color: white; padding: 25px 0; border-bottom: 3px solid #ff9900; }
    .card-custom { border: none; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    .nav-pills .nav-link.active { background-color: #ff9900; color: #002244; font-weight: bold; }
    .nav-pills .nav-link { color: #ffffff; margin: 0 5px; }
  </style>
</head>
<body>

  <!-- Top Header -->
  <div class="header-bg text-center mb-4">
    <h3><i class="fa-solid fa-bolt-lightning text-warning"></i> RATNAGIRI GAS & POWER PVT. LTD.</h3>
    <p class="mb-2 text-light">Online Complaint Management & Resolution Portal</p>
    <div class="d-flex justify-content-center mt-3">
      <ul class="nav nav-pills" id="pills-tab">
        <li class="nav-item">
          <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#new-complaint">
            <i class="fa-solid fa-pen-to-square"></i> New Complaint
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link" data-bs-toggle="pill" data-bs-target="#track-status">
            <i class="fa-solid fa-magnifying-glass"></i> Track Ticket
          </button>
        </li>
        <li class="nav-item">
          <a class="nav-link bg-dark text-warning border" href="admin.html">
            <i class="fa-solid fa-user-shield"></i> Admin Portal
          </a>
        </li>
      </ul>
    </div>
  </div>

  <div class="container">
    <div class="tab-content">
      
      <!-- 1. Register Complaint Tab -->
      <div class="tab-pane fade show active" id="new-complaint">
        <div class="row justify-content-center">
          <div class="col-md-8">
            <div class="card card-custom p-4 bg-white">
              <h5 class="text-primary mb-3"><i class="fa-solid fa-file-circle-plus"></i> Register New Complaint</h5>
              <form id="complaintForm">
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label fw-semibold">Full Name</label>
                    <input type="text" id="name" class="form-control" required placeholder="e.g. Ramesh Kumar">
                  </div>
                  <div class="col-md-6">
                    <label class="form-label fw-semibold">Contact / Intercom No.</label>
                    <input type="tel" id="contact" class="form-control" required placeholder="e.g. 9876543210">
                  </div>
                  <div class="col-md-6">
                    <label class="form-label fw-semibold">Location / Quarter / Office</label>
                    <input type="text" id="location" class="form-control" required placeholder="e.g. Type-C, Qtr 104">
                  </div>
                  <div class="col-md-6">
                    <label class="form-label fw-semibold">Department</label>
                    <select id="department" class="form-select" required>
                      <option value="">Select Department</option>
                      <option value="Civil Maintenance (colony)">Civil Maintenance (colony)</option>
                      <option value="Civil Maintenance">Civil Maintenance</option>
                      <option value="Electrical Maintenance (colony)">Electrical Maintenance (colony)</option>
                      <option value="IT / Network">IT / Network</option>
                    </select>
                  </div>
                  <div class="col-md-12">
                    <label class="form-label fw-semibold">Complaint Category / Type</label>
                    <input type="text" id="category" class="form-control" placeholder="e.g. Water Leakage, Fan Repair, LAN Issue">
                  </div>
                  <div class="col-md-12">
                    <label class="form-label fw-semibold">Complaint Details</label>
                    <textarea id="complaint" class="form-control" rows="3" required placeholder="Describe the issue in detail..."></textarea>
                  </div>
                </div>
                <button type="submit" id="submitBtn" class="btn btn-primary w-100 mt-4 py-2 fw-bold">
                  <i class="fa-solid fa-paper-plane me-1"></i> Submit Ticket
                </button>
              </form>
              <div id="formMsg" class="mt-3"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- 2. Track Status Tab -->
      <div class="tab-pane fade" id="track-status">
        <div class="row justify-content-center">
          <div class="col-md-6">
            <div class="card card-custom p-4 bg-white text-center">
              <h5 class="text-primary mb-3"><i class="fa-solid fa-list-check"></i> Check Complaint Status</h5>
              <div class="input-group mb-3">
                <input type="text" id="trackId" class="form-control" placeholder="Enter Complaint ID (e.g. 1001)">
                <button class="btn btn-primary" id="trackBtn" type="button">
                  <i class="fa-solid fa-search me-1"></i> Track
                </button>
              </div>
              <div id="statusResult" class="text-start mt-3"></div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbz2BTrcJ-SJcCBHDKMoz5sQRC0flvjMdpkZVzFweZaTAhNAlTrETmEnelV7EROt0pKd/exec";

    // Helper: Plain text payload to bypass CORS preflight
    async function sendRequest(payload) {
      const response = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });
      return await response.json();
    }

    // Submit New Complaint
    document.getElementById("complaintForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("submitBtn");
      const msg = document.getElementById("formMsg");
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-1"></i> Submitting...';
      msg.innerHTML = '';

      const payload = {
        action: "submitComplaint",
        formData: {
          name: document.getElementById("name").value.trim(),
          contact: document.getElementById("contact").value.trim(),
          location: document.getElementById("location").value.trim(),
          department: document.getElementById("department").value,
          category: document.getElementById("category").value.trim(),
          complaint: document.getElementById("complaint").value.trim()
        }
      };

      try {
        const data = await sendRequest(payload);
        if (data.success) {
          msg.innerHTML = `
            <div class="alert alert-success d-flex align-items-center">
              <i class="fa-solid fa-circle-check fa-2x me-3"></i>
              <div>
                <strong>Ticket Created Successfully!</strong><br>
                Your Complaint ID is: <span class="badge bg-dark fs-6">#${data.id}</span> (Keep this for tracking)
              </div>
            </div>`;
          document.getElementById("complaintForm").reset();
        } else {
          msg.innerHTML = `<div class="alert alert-danger"><i class="fa-solid fa-circle-exclamation me-1"></i>Error: ${data.error || 'Submission failed'}</div>`;
        }
      } catch (err) {
        msg.innerHTML = `<div class="alert alert-danger"><i class="fa-solid fa-triangle-exclamation me-1"></i>Network error. Please check connection and try again.</div>`;
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-paper-plane me-1"></i> Submit Ticket';
      }
    });

    // Track Complaint Status
    document.getElementById("trackBtn").addEventListener("click", async () => {
      const id = document.getElementById("trackId").value.trim();
      const resultDiv = document.getElementById("statusResult");
      if (!id) return alert("Please enter a Complaint ID");

      resultDiv.innerHTML = '<div class="text-center py-3"><i class="fa-solid fa-spinner fa-spin fa-2x text-primary"></i><p class="mt-2 mb-0">Searching ticket...</p></div>';

      try {
        const data = await sendRequest({ action: "trackStatus", complaintId: id });
        if (data.found) {
          let badgeClass = data.status === 'Resolved' ? 'bg-success' : (data.status === 'In Progress' ? 'bg-info text-dark' : 'bg-warning text-dark');
          resultDiv.innerHTML = `
            <div class="card p-3 border-primary shadow-sm">
              <div class="d-flex justify-content-between align-items-center mb-2">
                <h6 class="text-primary fw-bold mb-0">Ticket #${data.id}</h6>
                <span class="badge ${badgeClass}">${data.status}</span>
              </div>
              <p class="mb-1"><strong>Name:</strong> ${data.name}</p>
              <p class="mb-1"><strong>Location:</strong> ${data.location}</p>
              <p class="mb-1"><strong>Department:</strong> ${data.department}</p>
              <p class="mb-1"><strong>Issue:</strong> ${data.complaint}</p>
              <p class="mb-0 text-muted"><strong>Admin Remarks:</strong> ${data.remarks || 'Under Investigation'}</p>
            </div>`;
        } else {
          resultDiv.innerHTML = `<div class="alert alert-warning mb-0"><i class="fa-solid fa-circle-info me-1"></i>${data.message}</div>`;
        }
      } catch (err) {
        resultDiv.innerHTML = `<div class="alert alert-danger mb-0"><i class="fa-solid fa-triangle-exclamation me-1"></i>Failed to fetch ticket status.</div>`;
      }
    });
  </script>
</body>
</html>
