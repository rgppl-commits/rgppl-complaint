<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RGPPL - Online Complaint Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #f0f3f8; font-family: 'Segoe UI', sans-serif; }
    .header-bg { background: linear-gradient(135deg, #002244, #004080); color: white; padding: 25px 0; }
    .card-custom { border: none; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    .nav-pills .nav-link.active { background-color: #ff9900; color: #002244; font-weight: bold; }
    .nav-pills .nav-link { color: #ffffff; margin: 0 5px; }
  </style>
</head>
<body>

  <div class="header-bg text-center mb-4">
    <h3><i class="fa-solid fa-bolt-lightning text-warning"></i> RATNAGIRI GAS & POWER PVT. LTD.</h3>
    <p class="mb-2 text-light">Online Complaint Management & Resolution Portal</p>
    <div class="d-flex justify-content-center mt-3">
      <ul class="nav nav-pills" id="pills-tab">
        <li class="nav-item">
          <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#new-complaint"><i class="fa-solid fa-pen-to-square"></i> New Complaint</button>
        </li>
        <li class="nav-item">
          <button class="nav-link" data-bs-toggle="pill" data-bs-target="#track-status"><i class="fa-solid fa-magnifying-glass"></i> Track Ticket</button>
        </li>
        <li class="nav-item">
          <a class="nav-link bg-dark text-warning border" href="admin.html"><i class="fa-solid fa-user-shield"></i> Admin Portal</a>
        </li>
      </ul>
    </div>
  </div>

  <div class="container">
    <div class="tab-content">
      
      <!-- New Complaint Section -->
      <div class="tab-pane fade show active" id="new-complaint">
        <div class="row justify-content-center">
          <div class="col-md-8">
            <div class="card card-custom p-4 bg-white">
              <h5 class="text-primary mb-3"><i class="fa-solid fa-file-circle-plus"></i> Register New Complaint</h5>
              <form id="complaintForm">
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label font-weight-bold">Full Name</label>
                    <input type="text" id="name" class="form-control" required placeholder="e.g. Ramesh Kumar">
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Contact / Intercom No.</label>
                    <input type="tel" id="contact" class="form-control" required placeholder="e.g. 9876543210">
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Location / Quarter / Office</label>
                    <input type="text" id="location" class="form-control" required placeholder="e.g. Type-C, Qtr 104">
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Department</label>
                    <select id="department" class="form-select" required>
                      <option value="">Select Department</option>
                      <option value="Civil Maintenance">Civil Maintenance</option>
                      <option value="Electrical Maintenance">Electrical Maintenance</option>
                      <option value="IT / Network">IT / Network</option>
                      <option value="Township Administration">Township Administration</option>
                      <option value="Water Supply">Water Supply</option>
                    </select>
                  </div>
                  <div class="col-md-12">
                    <label class="form-label">Complaint Category / Type</label>
                    <input type="text" id="category" class="form-control" placeholder="e.g. Water Leakage, Fan Repair">
                  </div>
                  <div class="col-md-12">
                    <label class="form-label">Complaint Details</label>
                    <textarea id="complaint" class="form-control" rows="3" required placeholder="Describe the issue in detail..."></textarea>
                  </div>
                </div>
                <button type="submit" id="submitBtn" class="btn btn-primary w-100 mt-4"><i class="fa-solid fa-paper-plane"></i> Submit Ticket</button>
              </form>
              <div id="formMsg" class="mt-3"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Track Status Section -->
      <div class="tab-pane fade" id="track-status">
        <div class="row justify-content-center">
          <div class="col-md-6">
            <div class="card card-custom p-4 bg-white text-center">
              <h5 class="text-primary mb-3"><i class="fa-solid fa-list-check"></i> Check Complaint Status</h5>
              <div class="input-group mb-3">
                <input type="text" id="trackId" class="form-control" placeholder="Enter Complaint ID (e.g. 1001)">
                <button class="btn btn-primary" id="trackBtn" type="button"><i class="fa-solid fa-search"></i> Track</button>
              </div>
              <div id="statusResult" class="text-start mt-3"></div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbz2BTrcJ-SJcCBHDKMoz5sQRC0flvjMdpkZVzFweZaTAhNAlTrETmEnelV7EROt0pKd/exec";

    document.getElementById("complaintForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("submitBtn");
      const msg = document.getElementById("formMsg");
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Submitting...';
      msg.innerHTML = '';

      const payload = {
        action: "submitComplaint",
        formData: {
          name: document.getElementById("name").value,
          contact: document.getElementById("contact").value,
          location: document.getElementById("location").value,
          department: document.getElementById("department").value,
          category: document.getElementById("category").value,
          complaint: document.getElementById("complaint").value
        }
      };

      try {
        const res = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
        const data = await res.json();
        if(data.success) {
          msg.innerHTML = `<div class="alert alert-success">Ticket submitted! Your ID is: <strong>#${data.id}</strong></div>`;
          document.getElementById("complaintForm").reset();
        } else {
          msg.innerHTML = `<div class="alert alert-danger">Submission error: ${data.error}</div>`;
        }
      } catch (err) {
        msg.innerHTML = `<div class="alert alert-danger">Network error. Please try again.</div>`;
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Submit Ticket';
      }
    });

    document.getElementById("trackBtn").addEventListener("click", async () => {
      const id = document.getElementById("trackId").value.trim();
      const resultDiv = document.getElementById("statusResult");
      if (!id) return alert("Enter Complaint ID");

      resultDiv.innerHTML = '<div class="text-center py-2"><i class="fa-solid fa-spinner fa-spin"></i> Loading...</div>';

      try {
        const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "trackStatus", complaintId: id }) });
        const data = await res.json();
        if (data.found) {
          resultDiv.innerHTML = `
            <div class="card p-3 border-primary">
              <h6 class="text-primary font-weight-bold">Ticket #${data.id}</h6>
              <p class="mb-1"><strong>Name:</strong> ${data.name}</p>
              <p class="mb-1"><strong>Location:</strong> ${data.location}</p>
              <p class="mb-1"><strong>Department:</strong> ${data.department}</p>
              <p class="mb-1"><strong>Issue:</strong> ${data.complaint}</p>
              <p class="mb-1"><strong>Status:</strong> <span class="badge bg-${data.status === 'Resolved' ? 'success' : 'warning text-dark'}">${data.status}</span></p>
              <p class="mb-0"><strong>Remarks:</strong> ${data.remarks || 'None'}</p>
            </div>`;
        } else {
          resultDiv.innerHTML = `<div class="alert alert-warning">${data.message}</div>`;
        }
      } catch (err) {
        resultDiv.innerHTML = `<div class="alert alert-danger">Failed to fetch details.</div>`;
      }
    });
  </script>
</body>
</html>
